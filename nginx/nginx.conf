worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log kèm thời gian phản hồi và bản sao backend đã xử lý, phục vụ giám sát
    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                    'rt=$request_time urt=$upstream_response_time upstream=$upstream_addr';
    access_log /var/log/nginx/access.log main;

    sendfile          on;
    keepalive_timeout 65;
    server_tokens     off;   # ẩn phiên bản Nginx
    client_max_body_size 1m;

    gzip            on;
    gzip_min_length 1024;
    gzip_types      application/json application/javascript text/css;

    # DNS nội bộ của Docker; hỏi lại mỗi 10s để nhận các bản sao backend mới khi scale
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream backend_nodes {
        zone backend_nodes 64k;
        server backend:5000 resolve;   # chia tải round-robin giữa các bản sao backend
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        location /api/ {
            proxy_pass http://backend_nodes;
        }

        location = /health {
            proxy_pass http://backend_nodes;
            access_log off;
        }

        # Giao diện web tĩnh
        location / {
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            try_files $uri $uri/ /index.html;
        }
    }
}

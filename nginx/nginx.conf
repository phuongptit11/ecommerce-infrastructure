events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Bảo mật: Ẩn phiên bản Nginx để tránh hacker dò quét lỗ hổng
    server_tokens off;

    # Cấu hình log
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" - rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout 65;

    # Upstream trỏ tới backend Node.js trong mạng nội bộ Docker
    upstream backend_nodes {
        server backend:5000;
    }

    server {
        listen 80;
        server_name localhost;

        # 1. Tầng Web tĩnh: Phục vụ giao diện HTML/CSS demo
        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            try_files $uri $uri/ /index.html;
        }

        # 2. Reverse Proxy: Chuyển tiếp các request /api/ vào Backend Node.js
        location /api/ {
            proxy_pass http://backend_nodes;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Giới hạn thời gian chờ phản hồi từ backend
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # 3. Chuyển tiếp endpoint kiểm tra sức khỏe
        location /health {
            proxy_pass http://backend_nodes/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}